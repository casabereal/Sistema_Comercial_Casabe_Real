<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Casabe Real &mdash; Acceso al Sistema</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<div class="card">
  <div class="card-header">
    <div class="brand-logo-container">
      <img src="assets/logo-casabe-real.png" alt="Casabe Real" onerror="this.onerror=null; this.parentElement.innerHTML='<span style=\'font-weight:800;font-size:24px;color:var(--rojo)\'>CR</span>';">
    </div>
    <h1>Casabe Real</h1>
    <p>Sistema Comercial de Gestión (SCCR v2.5.0)</p>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tab-btn-login" onclick="switchTab('login')">
      <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
    </button>
    <button class="tab-btn" id="tab-btn-registro" onclick="switchTab('registro')">
      <i class="fas fa-user-plus"></i> Registro Nuevo Usuario
    </button>
  </div>

  <div class="card-body">
    <div id="alert-msg" class="alert"></div>

    <form id="form-login" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="login-user">Usuario / Cédula / RIF</label>
        <div class="input-wrapper">
          <i class="fas fa-user input-icon"></i>
          <input type="text" id="login-user" class="form-control" placeholder="Ej: v_perez" required autocomplete="username">
        </div>
      </div>

      <div class="form-group">
        <label for="login-pass">Contraseña</label>
        <div class="input-wrapper">
          <i class="fas fa-lock input-icon"></i>
          <input type="password" id="login-pass" class="form-control" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required autocomplete="current-password">
        </div>
      </div>

      <button type="submit" id="btn-login" class="btn-submit">
        <span id="sp-login" class="spinner"></span>
        <span id="txt-login"><i class="fas fa-arrow-right-to-bracket"></i> Ingresar al Sistema</span>
      </button>
    </form>

    <form id="form-registro" style="display: none;" onsubmit="handleRegistro(event)">
      <div class="form-group">
        <label for="reg-user">Usuario deseado</label>
        <div class="input-wrapper">
          <i class="fas fa-at input-icon"></i>
          <input type="text" id="reg-user" class="form-control" placeholder="Ej: v_perez" required>
        </div>
      </div>

      <div class="form-group">
        <label for="reg-nombre">Nombre y Apellido</label>
        <div class="input-wrapper">
          <i class="fas fa-id-card input-icon"></i>
          <input type="text" id="reg-nombre" class="form-control" placeholder="Ej: Víctor Pérez" required>
        </div>
      </div>

      <div class="form-group">
        <label for="reg-telefono">Teléfono / WhatsApp</label>
        <div class="input-wrapper">
          <i class="fas fa-phone input-icon"></i>
          <input type="tel" id="reg-telefono" class="form-control" placeholder="+58 412 1234567" required>
        </div>
      </div>

      <div class="form-group">
        <label for="reg-rol">Rol Solicitado</label>
        <div class="input-wrapper">
          <i class="fas fa-briefcase input-icon"></i>
          <select id="reg-rol" class="form-control select-control" required>
            <option value="VENDEDOR">Vendedor / Asesor Comercial</option>
            <option value="GERENTE">Gerente Comercial</option>
            <option value="ADMINISTRADOR">CEO / Administrador General</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="reg-pass">Contraseña</label>
        <div class="input-wrapper">
          <i class="fas fa-key input-icon"></i>
          <input type="password" id="reg-pass" class="form-control" placeholder="Mínimo 6 caracteres" minlength="6" required>
        </div>
      </div>

      <button type="submit" id="btn-registro" class="btn-submit">
        <span id="sp-registro" class="spinner"></span>
        <span id="txt-registro"><i class="fas fa-paper-plane"></i> Enviar Solicitud</span>
      </button>
    </form>

    <p class="footer-text">&copy; 2025 Casabe Real. Todos los derechos reservados.</p>
  </div>
</div>

<script src="config.js"></script>

<script>
  let currentTab = 'login';

  // Al cargar la página, redirigir si ya hay sesión activa
  document.addEventListener('DOMContentLoaded', () => {
    const activeUser = window.getSccrUser ? window.getSccrUser() : null;
    if (activeUser && activeUser.role) {
      window.redirectSccrByRole(activeUser.role);
    }
  });

  function switchTab(tab) {
    currentTab = tab;
    hideAlert();

    document.getElementById('tab-btn-login').classList.toggle('active', tab === 'login');
    document.getElementById('tab-btn-registro').classList.toggle('active', tab === 'registro');

    document.getElementById('form-login').style.display = tab === 'login' ? 'block' : 'none';
    document.getElementById('form-registro').style.display = tab === 'registro' ? 'block' : 'none';
  }

  function showAlert(msg, type = 'error') {
    const box = document.getElementById('alert-msg');
    box.className = 'alert alert-' + type;
    
    let iconClass = 'fa-exclamation-circle';
    if (type === 'success') iconClass = 'fa-check-circle';
    if (type === 'warning') iconClass = 'fa-triangle-exclamation';

    box.innerHTML = `<i class="fas ${iconClass}"></i> <span>${msg}</span>`;
    box.style.display = 'flex';
  }

  function hideAlert() {
    const box = document.getElementById('alert-msg');
    box.style.display = 'none';
  }

  // Generación de Hash SHA-256 para contraseñas seguras
  async function sha256(str) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  // Envoltorio de petición a la API respaldado por config.js
  async function sendRequest(payload) {
    if (typeof window.sendSccrRequest === 'function') {
      return await window.sendSccrRequest(payload.action, payload);
    } else {
      // Fallback directo si no detecta config.js
      const endpoint = window.APPS_SCRIPT_URL || SCCR_CONFIG.APPS_SCRIPT_URL;
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      return await res.json();
    }
  }

  // Manejo del Formulario de Inicio de Sesión
  async function handleLogin(e) {
    e.preventDefault();
    hideAlert();

    const user = document.getElementById('login-user').value.trim();
    const pass = document.getElementById('login-pass').value;

    if (!user || !pass) {
      showAlert('Por favor ingresa usuario y contraseña.');
      return;
    }

    setLoading('login', true);

    try {
      const passHash = await sha256(pass);
      const res = await sendRequest({
        action: 'login',
        user: user,
        pass_hash: passHash
      });

      if (res.status === 'SUCCESS' || res.success) {
        const userData = res.user || {
          username: user,
          nombre: res.nombre || user,
          role: res.rol || 'VENDEDOR'
        };

        // Guardar sesión en localStorage mediante config.js
        if (window.setSccrUser) {
          window.setSccrUser(userData);
        } else {
          localStorage.setItem('sccr_user_session', JSON.stringify(userData));
        }

        showAlert('¡Autenticación exitosa! Redirigiendo...', 'success');
        
        setTimeout(() => {
          if (window.redirectSccrByRole) {
            window.redirectSccrByRole(userData.role);
          } else {
            window.location.href = (userData.role.toLowerCase() + '.html');
          }
        }, 1000);

      } else if (res.status === 'PENDING') {
        showAlert(res.message || 'Tu usuario aún está pendiente de aprobación por la administración.', 'warning');
      } else {
        showAlert(res.message || 'Usuario o contraseña incorrectos.');
      }
    } catch (err) {
      showAlert('Error al conectar con el servidor: ' + err.message);
    } finally {
      setLoading('login', false);
    }
  }

  // Manejo del Formulario de Registro / Solicitud de Acceso
  async function handleRegistro(e) {
    e.preventDefault();
    hideAlert();

    const user = document.getElementById('reg-user').value.trim();
    const nombre = document.getElementById('reg-nombre').value.trim();
    const telefono = document.getElementById('reg-telefono').value.trim();
    const rol = document.getElementById('reg-rol').value;
    const pass = document.getElementById('reg-pass').value;

    if (!user || !nombre || !email || !telefono || !pass) {
      showAlert('Todos los campos son obligatorios para enviar la solicitud.');
      return;
    }

    setLoading('registro', true);

    try {
      const passHash = await sha256(pass);
      const res = await sendRequest({
        action: 'registrar',
        user: user,
        nombre: nombre,
        telefono: telefono,
        rol: rol,
        pass_hash: passHash
      });

      if (res.status === 'SUCCESS' || res.success) {
        showAlert(res.message || 'Solicitud enviada con éxito. Un administrador revisará tu cuenta.', 'success');
        document.getElementById('form-registro').reset();
      } else {
        showAlert(res.message || 'No se pudo procesar la solicitud de registro.');
      }
    } catch (err) {
      showAlert('Error al procesar el registro: ' + err.message);
    } finally {
      setLoading('registro', false);
    }
  }

  function setLoading(type, isLoading) {
    const btn = document.getElementById('btn-' + type);
    const sp = document.getElementById('sp-' + type);
    const txt = document.getElementById('txt-' + type);

    btn.disabled = isLoading;
    sp.style.display = isLoading ? 'inline-block' : 'none';
    txt.style.opacity = isLoading ? '0.7' : '1';
  }
</script>
</body>
</html>
