<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Casabe Real &mdash; Acceso</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --rojo:#C8181E;--rojo-d:#A01015;--rojo-xs:#FEF2F2;
    --fondo:#F3F4F6;--borde:#E5E7EB;
    --gris:#6B7280;--negro:#111827;
    --naranja:#D97706;--naranja-xs:#FFFBEB;
    --r:14px;--r-sm:9px;
    --sh:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
    --sh-lg:0 8px 32px rgba(0,0,0,.14);
  }
  body{
    font-family:"Inter",sans-serif;
    background:var(--rojo);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .login-card{
    background:#fff;
    width:100%;
    max-width:420px;
    border-radius:var(--r);
    box-shadow:var(--sh-lg);
    padding:35px 30px;
    animation:fadeIn .4s ease;
  }
  @keyframes fadeIn {
    from { opacity:0; transform: translateY(10px); }
    to { opacity:1; transform: translateY(0); }
  }
  .logo-area{text-align:center;margin-bottom:25px}
  .logo-area img{max-width:140px;height:auto;margin-bottom:10px}
  .logo-area h1{font-size:20px;font-weight:700;color:var(--negro)}
  .logo-area p{font-size:13px;color:var(--gris);margin-top:4px}
  
  .tabs{display:flex;background:var(--fondo);border-radius:var(--r-sm);padding:4px;margin-bottom:25px}
  .tab{flex:1;text-align:center;padding:10px;font-size:13px;font-weight:600;color:var(--gris);cursor:pointer;border-radius:7px;transition:all .2s}
  .tab.active{background:#fff;color:var(--rojo);box-shadow:var(--sh)}
  
  .form-group{margin-bottom:16px}
  .form-label{display:block;font-size:12px;font-weight:600;color:var(--negro);margin-bottom:6px}
  .form-control{
    width:100%;padding:11px 14px;font-size:14px;border:1px solid var(--borde);
    border-radius:var(--r-sm);outline:none;transition:border-color .2s;background:#fff;color:var(--negro)
  }
  .form-control:focus{border-color:var(--rojo)}
  
  .btn-submit{
    width:100%;padding:12px;background:var(--rojo);color:#fff;font-size:14px;
    font-weight:600;border:none;border-radius:var(--r-sm);cursor:pointer;transition:background .2s;margin-top:10px
  }
  .btn-submit:hover{background:var(--rojo-d)}
  .btn-submit:disabled{background:var(--borde);color:var(--gris);cursor:not-allowed}
  
  .panel{display:none}
  .panel.active{display:block}
  
  .spinner{display:none;width:18px;height:18px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto}
  .spinner.show{display:inline-block}
  @keyframes spin {to{transform:rotate(360deg)}}

  .alert{padding:10px;border-radius:var(--r-sm);font-size:13px;margin-top:12px;display:none}
  .alert.error{background:var(--rojo-xs);color:var(--rojo);border:1px solid #fecaca;display:block}
  .alert.success{background:#ecfdf5;color:#059669;border:1px solid #a7f3d0;display:block}
  
  .ver{text-align:center;font-size:11px;color:var(--gris);margin-top:20px}
</style>
</head>
<body>

<div class="login-card">
  <div class="logo-area">
    <h1>Casabe Real &mdash; SCCR</h1>
    <p>Sistema Comercial de Gestión</p>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('login')">Ingresar</div>
    <div class="tab" onclick="switchTab('registro')">Solicitar Acceso</div>
  </div>

  <div id="panel-login" class="panel active">
    <form id="form-login" onsubmit="ejecutarLogin(event)">
      <div class="form-group">
        <label class="form-label">Correo electrónico</label>
        <input type="email" id="login-email" class="form-control" required placeholder="usuario@casabereal.com">
      </div>
      <div class="form-group">
        <label class="form-label">Contraseña</label>
        <input type="password" id="login-pass" class="form-control" required placeholder="••••••••">
      </div>
      <button type="submit" id="btn-login" class="btn-submit">
        <span id="txt-login">Entrar al Sistema</span>
        <span id="sp-login" class="spinner"></span>
      </button>
      <div id="err-login" class="alert error"></div>
    </form>
  </div>

  <div id="panel-registro" class="panel">
    <form id="form-registro" onsubmit="ejecutarRegistro(event)">
      <div class="form-group">
        <label class="form-label">Nombre y Apellido</label>
        <input type="text" id="reg-nombre" class="form-control" required placeholder="Tu Nombre">
      </div>
      <div class="form-group">
        <label class="form-label">Correo Electrónico</label>
        <input type="email" id="reg-email" class="form-control" required placeholder="tu.correo@casabereal.com">
      </div>
      <div class="form-group">
        <label class="form-label">Contraseña Temporal / Deseada</label>
        <input type="password" id="reg-pass" class="form-control" required placeholder="••••••••">
      </div>
      <button type="submit" id="btn-registro" class="btn-submit">
        <span id="txt-registro">Enviar Solicitud</span>
        <span id="sp-registro" class="spinner"></span>
      </button>
      <div id="err-registro" class="alert error"></div>
      <div id="succ-registro" class="alert success" style="display:none;">¡Solicitud enviada con éxito! Quedará pendiente de aprobación por el administrador.</div>
    </form>
  </div>

  <div class="ver">SCCR v2.5.0 &bull; Casabe Real &copy; 2026</div>
</div>

<script>
  // URL de tu Web App desplegada en Google Apps Script
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwbIAY0hVKsZcONfp1A2fVisXtmZfHaN9m-CIh7qQHPFuPvjbmpQzkVMVVajkaIZekSbA/exec";

  function switchTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    if(tab === 'login') {
      document.querySelectorAll('.tab')[0].classList.add('active');
      document.getElementById('panel-login').classList.add('active');
    } else {
      document.querySelectorAll('.tab')[1].classList.add('active');
      document.getElementById('panel-registro').classList.add('active');
    }
  }

  async function ejecutarLogin(e) {
    e.preventDefault();
    const email = document.getElementById('login-email').value.trim();
    const pass = document.getElementById('login-pass').value.trim();
    const btn = document.getElementById('btn-login');
    const sp = document.getElementById('sp-login');
    const txt = document.getElementById('txt-login');
    const err = document.getElementById('err-login');

    btn.disabled = true;
    txt.style.display = 'none';
    sp.classList.add('show');
    err.classList.remove('error');
    err.style.display = 'none';

    try {
      const response = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'login', email: email, pass: pass })
      });
      const res = await response.json();

      if (res.status === 'SUCCESS') {
        // Redirección exitosa según el rol devuelto por el backend
        localStorage.setItem('sccr_user', JSON.stringify(res.user));
        if (res.role === 'administrador') window.location.href = 'administrador.html';
        else if (res.role === 'gerente') window.location.href = 'gerente.html';
        else window.location.href = 'vendedor.html';
      } else {
        throw new Error(res.message || 'Credenciales inválidas o usuario pendiente.');
      }
    } catch (error) {
      err.textContent = error.message || 'Error de conexión con el servidor.';
      err.style.display = 'block';
      btn.disabled = false;
      txt.style.display = 'inline';
      sp.classList.remove('show');
    }
  }

  async function ejecutarRegistro(e) {
    e.preventDefault();
    const nombre = document.getElementById('reg-nombre').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const pass = document.getElementById('reg-pass').value.trim();
    const btn = document.getElementById('btn-registro');
    const sp = document.getElementById('sp-registro');
    const txt = document.getElementById('txt-registro');
    const err = document.getElementById('err-registro');
    const succ = document.getElementById('succ-registro');

    btn.disabled = true;
    txt.style.display = 'none';
    sp.classList.add('show');
    err.style.display = 'none';
    succ.style.display = 'none';

    try {
      const response = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'registrar', nombre: nombre, email: email, pass: pass })
      });
      const res = await response.json();

      if (res.status === 'SUCCESS') {
        succ.style.display = 'block';
        document.getElementById('form-registro').reset();
        btn.style.display = 'none';
      } else {
        throw new Error(res.message || 'No se pudo procesar el registro.');
      }
    } catch (error) {
      err.textContent = error.message || 'Error al procesar la solicitud.';
      err.style.display = 'block';
      btn.disabled = false;
      txt.style.display = 'inline';
      sp.classList.remove('show');
    }
  }
</script>
</body>
</html>
