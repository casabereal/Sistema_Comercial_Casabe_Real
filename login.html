<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Casabe Real &mdash; Acceso al Sistema (SCCR)</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script src="config.js"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  
  /* Variables alineadas con SCCR_CONFIG.THEME */
  :root {
    --rojo: #D71920;
    --rojo-d: #A01015;
    --rojo-xs: #FEF2F2;
    --fondo: #F5F7FA;
    --borde: #E5E7EB;
    --gris: #7F8C8D;
    --negro: #2D3436;
    --verde: #2ECC71;
    --amarillo: #F39C12;
    --r: 12px;
    --r-sm: 8px;
    --sh: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
  }

  body {
    font-family: 'Inter', sans-serif;
    background-color: var(--fondo);
    color: var(--negro);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .login-card {
    background: #FFFFFF;
    width: 100%;
    max-width: 440px;
    border-radius: var(--r);
    box-shadow: var(--sh);
    border: 1px solid var(--borde);
    overflow: hidden;
  }

  .brand-header {
    background: #FFFFFF;
    padding: 32px 24px 20px 24px;
    text-align: center;
    border-bottom: 1px solid var(--borde);
  }

  .brand-logo-img {
    max-width: 190px;
    height: auto;
    object-fit: contain;
    margin-bottom: 8px;
  }

  .brand-logo-fallback {
    font-family: 'Montserrat', sans-serif;
    font-size: 24px;
    font-weight: 800;
    color: var(--rojo);
    text-transform: uppercase;
    letter-spacing: -0.5px;
  }

  .brand-subtitle {
    font-size: 13px;
    color: var(--gris);
    font-weight: 500;
    margin-top: 4px;
  }

  /* Pestañas */
  .tabs {
    display: flex;
    background: #F8FAFC;
    border-bottom: 1px solid var(--borde);
  }

  .tab-btn {
    flex: 1;
    padding: 14px 10px;
    background: transparent;
    border: none;
    font-family: 'Montserrat', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--gris);
    cursor: pointer;
    transition: all 0.2s ease;
    border-bottom: 3px solid transparent;
  }

  .tab-btn.active {
    color: var(--rojo);
    border-bottom-color: var(--rojo);
    background: #FFFFFF;
  }

  /* Formulario */
  .card-body {
    padding: 28px 24px;
  }

  .form-group {
    margin-bottom: 18px;
  }

  .form-group label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--negro);
    margin-bottom: 6px;
  }

  .input-wrapper {
    position: relative;
  }

  .input-wrapper i {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--gris);
    font-size: 14px;
  }

  .form-control {
    width: 100%;
    padding: 12px 14px 12px 40px;
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    border: 1px solid var(--borde);
    border-radius: var(--r-sm);
    background: #FFFFFF;
    color: var(--negro);
    outline: none;
    transition: border-color 0.2s;
  }

  .form-control:focus {
    border-color: var(--rojo);
    box-shadow: 0 0 0 3px rgba(215, 25, 32, 0.1);
  }

  select.form-control {
    padding-left: 40px;
    appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%3c7F8C8D' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: right 12px center;
    background-size: 16px;
  }

  /* Botones */
  .btn-submit {
    width: 100%;
    padding: 14px;
    background: var(--rojo);
    color: #FFFFFF;
    border: none;
    border-radius: var(--r-sm);
    font-family: 'Montserrat', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 10px;
  }

  .btn-submit:hover {
    background: var(--rojo-d);
  }

  .btn-submit:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  /* Alertas */
  .alert {
    padding: 12px 14px;
    border-radius: var(--r-sm);
    font-size: 13px;
    margin-bottom: 18px;
    display: none;
    align-items: center;
    gap: 10px;
  }

  .alert-danger {
    background: var(--rojo-xs);
    color: var(--rojo-d);
    border: 1px solid #FCA5A5;
  }

  .alert-success {
    background: #ECFDF5;
    color: #065F46;
    border: 1px solid #A7F3D0;
  }

  .alert-warning {
    background: #FFFBEB;
    color: #92400E;
    border: 1px solid #FDE68A;
  }

  .spinner {
    width: 16px;
    height: 16px;
    border: 2px solid #ffffff;
    border-bottom-color: transparent;
    border-radius: 50%;
    display: inline-block;
    animation: rotation 1s linear infinite;
  }

  @keyframes rotation {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  .footer-text {
    margin-top: 24px;
    font-size: 12px;
    color: var(--gris);
    text-align: center;
  }
</style>
</head>
<body>

<div class="login-card">
  <div class="brand-header">
    <img src="assets/logo-casabe-real.png" alt="Casabe Real" class="brand-logo-img" onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='block';">
    <div id="logo-fallback" class="brand-logo-fallback" style="display:none;">CASABE REAL</div>
    <div class="brand-subtitle">Sistema Comercial Casabe Real (SCCR)</div>
  </div>

  <div class="tabs">
    <button type="button" class="tab-btn active" onclick="switchTab('login')">
      <i class="fas fa-key"></i> Iniciar Sesión
    </button>
    <button type="button" class="tab-btn" onclick="switchTab('registro')">
      <i class="fas fa-user-plus"></i> Registro de Nuevo Usuario
    </button>
  </div>

  <div class="card-body">
    <div id="alert-box" class="alert"></div>

    <form id="form-login" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="login-user">Usuario</label>
        <div class="input-wrapper">
          <i class="fas fa-user"></i>
          <input type="text" id="login-user" class="form-control" placeholder="Ingresa tu usuario" required autocomplete="username">
        </div>
      </div>

      <div class="form-group">
        <label for="login-pass">Contraseña</label>
        <div class="input-wrapper">
          <i class="fas fa-lock"></i>
          <input type="password" id="login-pass" class="form-control" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required autocomplete="current-password">
        </div>
      </div>

      <button type="submit" id="btn-login" class="btn-submit">
        <span id="sp-login" class="spinner" style="display:none;"></span>
        <span id="txt-login"><i class="fas fa-sign-in-alt"></i> Entrar al Sistema</span>
      </button>
    </form>

    <form id="form-registro" style="display:none;" onsubmit="handleRegistro(event)">
      <div class="form-group">
        <label for="reg-user">Usuario para el Sistema</label>
        <div class="input-wrapper">
          <i class="fas fa-at"></i>
          <input type="text" id="reg-user" class="form-control" placeholder="Ej: perez.j" required autocomplete="off">
        </div>
      </div>

      <div class="form-group">
        <label for="reg-nombre">Nombre Completo</label>
        <div class="input-wrapper">
          <i class="fas fa-id-card"></i>
          <input type="text" id="reg-nombre" class="form-control" placeholder="Ej: Juan Pérez" required autocomplete="name">
        </div>
      </div>

      <div class="form-group">
        <label for="reg-telefono">Teléfono / WhatsApp</label>
        <div class="input-wrapper">
          <i class="fas fa-phone"></i>
          <input type="tel" id="reg-telefono" class="form-control" placeholder="Ej: +58 412 1234567" required autocomplete="tel">
        </div>
      </div>

      <div class="form-group">
        <label for="reg-rol">Rol Solicitado</label>
        <div class="input-wrapper">
          <i class="fas fa-user-tag"></i>
          <select id="reg-rol" class="form-control">
            <option value="vendedor">Vendedor / Asesor</option>
            <option value="gerente">Gerente Comercial</option>
            <option value="administrador">CEO / Administrador</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="reg-pass">Contraseña</label>
        <div class="input-wrapper">
          <i class="fas fa-lock"></i>
          <input type="password" id="reg-pass" class="form-control" placeholder="Crea tu contraseña" required autocomplete="new-password">
        </div>
      </div>

      <button type="submit" id="btn-registro" class="btn-submit">
        <span id="sp-registro" class="spinner" style="display:none;"></span>
        <span id="txt-registro"><i class="fas fa-user-check"></i> Registro de Nuevo Usuario</span>
      </button>
    </form>
  </div>
</div>

<div class="footer-text">
  &copy; <span id="year-copy"></span> Casabe Real &bull; Todos los derechos reservados.
</div>

<script>
  document.getElementById('year-copy').textContent = new Date().getFullYear();

  // Redirección automática si ya existe una sesión activa
  document.addEventListener('DOMContentLoaded', function() {
    if (window.getSccrUser && window.redirectSccrByRole) {
      const activeUser = window.getSccrUser();
      if (activeUser && activeUser.user && activeUser.rol) {
        window.redirectSccrByRole(activeUser.rol);
      }
    }
  });

  // Alternar entre pestañas Login / Registro
  function switchTab(tab) {
    hideAlert();
    const btnLogin = document.querySelectorAll('.tab-btn')[0];
    const btnReg = document.querySelectorAll('.tab-btn')[1];
    const formLogin = document.getElementById('form-login');
    const formReg = document.getElementById('form-registro');

    if (tab === 'login') {
      btnLogin.classList.add('active');
      btnReg.classList.remove('active');
      formLogin.style.display = 'block';
      formReg.style.display = 'none';
    } else {
      btnReg.classList.add('active');
      btnLogin.classList.remove('active');
      formReg.style.display = 'block';
      formLogin.style.display = 'none';
    }
  }

  // Generador Hash SHA-256
  async function sha256(str) {
    const buffer = new TextEncoder().encode(str);
    const hashBuffer = await crypto.subtle.digest('SHA-256', buffer);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
  }

  // Ejecución de Login
  async function handleLogin(e) {
    e.preventDefault();
    hideAlert();

    const user = document.getElementById('login-user').value.trim();
    const pass = document.getElementById('login-pass').value;

    if (!user || !pass) {
      showAlert('Por favor ingrese su usuario y contraseña.', 'danger');
      return;
    }

    setLoading('login', true);

    try {
      const passHash = await sha256(pass);
      const res = await sendRequest({
        action: 'login',
        user: user,
        pass_hash: passHash
      });

      if (res.status === 'SUCCESS') {
        showAlert('¡Acceso correcto! Redirigiendo...', 'success');
        
        // Guardar sesión en config.js
        if (window.setSccrUser) {
          window.setSccrUser(res.user);
        }

        setTimeout(() => {
          if (window.redirectSccrByRole) {
            window.redirectSccrByRole(res.user.rol);
          } else {
            window.location.href = 'vendedor.html';
          }
        }, 1000);

      } else if (res.status === 'PENDING') {
        showAlert(res.message || 'Tu solicitud de acceso aún está pendiente de aprobación.', 'warning');
      } else {
        showAlert(res.message || 'Usuario o contraseña incorrectos.', 'danger');
      }

    } catch (err) {
      showAlert('Error al conectar con la base de datos SCCR: ' + err.message, 'danger');
    } finally {
      setLoading('login', false);
    }
  }

  // Ejecución de Registro de Nuevo Usuario
  async function handleRegistro(e) {
    e.preventDefault();
    hideAlert();

    const user = document.getElementById('reg-user').value.trim();
    const nombre = document.getElementById('reg-nombre').value.trim();
    const telefono = document.getElementById('reg-telefono').value.trim();
    const rol = document.getElementById('reg-rol').value;
    const pass = document.getElementById('reg-pass').value;

    if (!user || !nombre || !telefono || !pass) {
      showAlert('Todos los campos son obligatorios.', 'danger');
      return;
    }

    setLoading('registro', true);

    try {
      const passHash = await sha256(pass);
      
      // Alias de correo institucional para mantener compatibilidad técnica con Code.gs
      const emailAlias = `${user.toLowerCase().replace(/\s+/g, '')}@casabereal.local`;

      const res = await sendRequest({
        action: 'registrar',
        user: user,
        nombre: nombre,
        email: emailAlias,
        telefono: telefono,
        rol: rol,
        pass_hash: passHash
      });

      if (res.status === 'SUCCESS') {
        showAlert(res.message, 'success');
        document.getElementById('form-registro').reset();
      } else {
        showAlert(res.message || 'No se pudo procesar el registro.', 'danger');
      }
    } catch (err) {
      showAlert('Error al procesar la solicitud: ' + err.message, 'danger');
    } finally {
      setLoading('registro', false);
    }
  }

  // Envío Unificado a la API de Google Apps Script
  async function sendRequest(payload) {
    // Si la función global de config.js está disponible, se utiliza directamente
    if (window.sendSccrRequest) {
      return await window.sendSccrRequest(payload.action, payload);
    }

    // Respaldo de conexión asíncrona
    const endpoint = (typeof SCCR_CONFIG !== 'undefined' && SCCR_CONFIG.APPS_SCRIPT_URL)
      ? SCCR_CONFIG.APPS_SCRIPT_URL
      : '';

    if (!endpoint) {
      throw new Error('No se ha configurado la URL de Apps Script en config.js');
    }

    const response = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });

    return await response.json();
  }

  // Controladores de UI
  function setLoading(type, isLoading) {
    const btn = document.getElementById('btn-' + type);
    const sp = document.getElementById('sp-' + type);
    const txt = document.getElementById('txt-' + type);

    btn.disabled = isLoading;
    sp.style.display = isLoading ? 'inline-block' : 'none';
    txt.style.opacity = isLoading ? '0.7' : '1';
  }

  function showAlert(msg, type = 'danger') {
    const box = document.getElementById('alert-box');
    box.className = `alert alert-${type}`;
    box.style.display = 'flex';
    
    let icon = 'fa-exclamation-circle';
    if (type === 'success') icon = 'fa-check-circle';
    if (type === 'warning') icon = 'fa-clock';

    box.innerHTML = `<i class="fas ${icon}"></i> <span>${msg}</span>`;
  }

  function hideAlert() {
    const box = document.getElementById('alert-box');
    box.style.display = 'none';
  }
</script>
</body>
</html>
