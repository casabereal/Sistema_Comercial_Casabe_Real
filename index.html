<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Casabe Real &mdash; Acceso</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --rojo:#C8181E;--rojo-d:#A01015;--rojo-xs:#FEF2F2;
  --fondo:#F3F4F6;--borde:#E5E7EB;
  --gris:#6B7280;--negro:#111827;
  --naranja:#D97706;--naranja-xs:#FFFBEB;
  --r:14px;--r-sm:9px;
  --sh:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  --sh-lg:0 8px 32px rgba(0,0,0,.14);
}
body{
  font-family:"Inter",sans-serif;
  background:var(--rojo);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.login-card{
  background:#fff;
  width:100%;
  max-width:420px;
  border-radius:var(--r);
  box-shadow:var(--sh-lg);
  padding:32px 28px;
  position:relative;
}
.logo-area{
  text-align:center;
  margin-bottom:24px;
}
.logo-area img{
  width:64px;
  height:64px;
  object-fit:contain;
  margin-bottom:10px;
}
.logo-area h1{
  font-size:1.25rem;
  font-weight:700;
  color:var(--negro);
  letter-spacing:-0.5px;
}
.logo-area p{
  font-size:0.8rem;
  color:var(--gris);
  margin-top:4px;
}
.form-group{
  margin-bottom:16px;
}
.form-label{
  display:block;
  font-size:0.75rem;
  font-weight:600;
  color:var(--negro);
  margin-bottom:6px;
}
.form-control{
  width:100%;
  padding:11px 14px;
  border:1px solid var(--borde);
  border-radius:var(--r-sm);
  font-family:"Inter",sans-serif;
  font-size:0.85rem;
  color:var(--negro);
  background:#fff;
  transition:border-color .2s,box-shadow .2s;
}
.form-control:focus{
  outline:none;
  border-color:var(--rojo);
  box-shadow:0 0 0 3px var(--rojo-xs);
}
.btn-primary{
  width:100%;
  background:var(--rojo);
  color:#fff;
  border:none;
  padding:12px;
  border-radius:var(--r-sm);
  font-family:"Inter",sans-serif;
  font-size:0.85rem;
  font-weight:600;
  cursor:pointer;
  transition:background .2s;
  margin-top:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}
.btn-primary:hover{
  background:var(--rojo-d);
}
.error-msg{
  background:var(--rojo-xs);
  color:var(--rojo);
  padding:10px 14px;
  border-radius:var(--r-sm);
  font-size:0.75rem;
  margin-bottom:16px;
  display:none;
  font-weight:500;
}
.error-msg.show{display:block;}
.tabs{
  display:flex;
  border-bottom:1px solid var(--borde);
  margin-bottom:20px;
}
.tab{
  flex:1;
  text-align:center;
  padding:10px;
  font-size:0.8rem;
  font-weight:600;
  color:var(--gris);
  cursor:pointer;
  border-bottom:2px solid transparent;
  transition:all .2s;
}
.tab.active{
  color:var(--rojo);
  border-bottom-color:var(--rojo);
}
.tab-content{display:none;}
.tab-content.active{display:block;}
.spinner{
  width:16px;
  height:16px;
  border:2px solid #fff;
  border-top-color:transparent;
  border-radius:50%;
  animation:spin .8s linear infinite;
  display:none;
}
.spinner.show{display:inline-block;}
@keyframes spin{to{transform:rotate(360deg)}}
.pend-reg{
  background:var(--naranja-xs);
  color:var(--naranja);
  padding:12px;
  border-radius:var(--r-sm);
  font-size:0.75rem;
  text-align:center;
  margin-top:12px;
  display:none;
  font-weight:500;
}
.pend-reg.show{display:block;}
</style>
</head>
<body>

<div class="login-card">
  <div class="logo-area">
    <img src="assets/logo-casabe-real.png" alt="Casabe Real" onerror="this.style.display='none'">
    <h1>Casabe Real</h1>
    <p>Sistema Comercial (SCCR)</p>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('login')">Iniciar Sesión</div>
    <div class="tab" onclick="switchTab('registro')">Registrarse</div>
  </div>

  <div id="tab-login" class="tab-content active">
    <div id="login-error" class="error-msg"></div>
    <div class="form-group">
      <label class="form-label">Usuario</label>
      <input type="text" id="l-user" class="form-control" placeholder="Ingrese su usuario" autocomplete="username">
    </div>
    <div class="form-group">
      <label class="form-label">Contraseña</label>
      <input type="password" id="l-pass" class="form-control" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn-primary" id="btn-login" onclick="hacerLogin()">
      <span id="login-txt">Ingresar</span>
      <span class="spinner" id="login-spin"></span>
    </button>
  </div>

  <div id="tab-registro" class="tab-content">
    <div id="reg-error" class="error-msg"></div>
    <div class="form-group">
      <label class="form-label">Nombre y Apellido</label>
      <input type="text" id="r-nombre" class="form-control" placeholder="Ej. Carlos Mendoza">
    </div>
    <div class="form-group">
      <label class="form-label">Usuario deseado</label>
      <input type="text" id="r-user" class="form-control" placeholder="ej. cmendoza">
    </div>
    <div class="form-group">
      <label class="form-label">Contraseña</label>
      <input type="password" id="r-pass" class="form-control" placeholder="••••••••">
    </div>
    <div class="form-group">
      <label class="form-label">Confirmar Contraseña</label>
      <input type="password" id="r-pass2" class="form-control" placeholder="••••••••">
    </div>
    <button class="btn-primary" id="btn-reg" onclick="hacerRegistro()">
      <span id="reg-txt">Solicitar Registro</span>
      <span class="spinner" id="reg-spin"></span>
    </button>
    <div id="pend-reg" class="pend-reg">
      Solicitud enviada con éxito. Un administrador debe aprobar su cuenta antes de ingresar.
    </div>
  </div>
</div>

<script>
  function switchTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    
    if(tab === 'login') {
      document.querySelectorAll('.tab')[0].classList.add('active');
      document.getElementById('tab-login').classList.add('active');
    } else {
      document.querySelectorAll('.tab')[1].classList.add('active');
      document.getElementById('tab-registro').classList.add('active');
    }
  }

  const API = 'https://script.google.com/macros/s/AKfycbysSUeGA965zGGIF1Zpcbji1SNmkM_kKNoXmFwud6P7kHv0cTlKNJopVF3T93QKhqPs9A/exec';

  async function hacerLogin() {
    const u = document.getElementById('l-user').value.trim();
    const p = document.getElementById('l-pass').value;
    const err = document.getElementById('login-error');
    const btn = document.getElementById('btn-login');
    const txt = document.getElementById('login-txt');
    const sp = document.getElementById('login-spin');

    err.classList.remove('show');
    if(!u || !p) {
      err.textContent = 'Por favor, complete todos los campos.';
      err.classList.add('show');
      return;
    }

    btn.disabled = true;
    txt.style.display = 'none';
    sp.classList.add('show');

    try {
      const response = await fetch(API, {
        method: 'POST',
        body: JSON.stringify({
          action: 'login',
          user: u,
          pass: p
        }),
        redirect: 'follow'
      });

      const data = await response.json();

      if(data.ok || data.success) {
        sessionStorage.setItem('sccr', JSON.stringify({
          nombre: data.nombre || u.toUpperCase(),
          rol: data.rol || 'Vendedor',
          user: u
        }));
        window.location.href = 'inicio.html';
      } else {
        err.textContent = data.msg || 'Usuario o contraseña incorrectos.';
        err.classList.add('show');
        btn.disabled = false;
        txt.style.display = '';
        sp.classList.remove('show');
      }
    } catch(e) {
      err.textContent = 'Error al conectar con el servidor. Verifique la URL de la API.';
      err.classList.add('show');
      btn.disabled = false;
      txt.style.display = '';
      sp.classList.remove('show');
    }
  }

  async function hacerRegistro() {
    const n = document.getElementById('r-nombre').value.trim();
    const u = document.getElementById('r-user').value.trim();
    const p = document.getElementById('r-pass').value;
    const p2 = document.getElementById('r-pass2').value;
    const err = document.getElementById('reg-error');
    const btn = document.getElementById('btn-reg');
    const txt = document.getElementById('reg-txt');
    const sp = document.getElementById('reg-spin');

    err.classList.remove('show');
    if(!n || !u || !p || !p2) {
      err.textContent = 'Todos los campos son obligatorios.';
      err.classList.add('show');
      return;
    }
    if(p !== p2) {
      err.textContent = 'Las contraseñas no coinciden.';
      err.classList.add('show');
      return;
    }

    btn.disabled = true;
    txt.style.display = 'none';
    sp.classList.add('show');

    try {
      const formData = new URLSearchParams();
      formData.append('action', 'registro');
      formData.append('nombre', n);
      formData.append('user', u);
      formData.append('pass', p);

      const response = await fetch(API, {
        method: 'POST',
        body: formData,
        redirect: 'follow'
      });
      
      const data = await response.json();
      if(data.ok || data.success) { 
        showPendiente(); 
      } else { 
        err.textContent = data.msg || 'Error al registrar. Intenta de nuevo.'; 
        err.classList.add('show'); 
      }
    } catch(e) {
      showPendiente();
    }

    btn.disabled = false;
    txt.style.display = '';
    sp.classList.remove('show');
  }

  function showPendiente() {
    ['r-nombre', 'r-user', 'r-pass', 'r-pass2'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('pend-reg').classList.add('show');
    document.getElementById('btn-reg').style.display = 'none';
  }

  window.addEventListener('DOMContentLoaded', () => {
    try {
      const raw = sessionStorage.getItem('sccr');
      if(raw) {
        window.location.href = 'inicio.html';
      }
    } catch(e) {}
  });
</script>
</body>
</html>
